<?xml version="1.0" encoding="UTF-8"?>
<!--
  Weight Tracker, launcher icon. Drawn on a 172 px grid, the largest size the app ships;
  the PNGs in icons/ are this file rendered at 86, 108, 128 and 172 px.
  A bathroom scale seen from above: the dial window with its needle, and the groove
  between the two feet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="172" height="172" viewBox="0 0 172 172">
  <!-- The scale. -->
  <rect x="10" y="10" width="152" height="152" rx="30" fill="#e8463a"/>
  <rect x="10" y="10" width="152" height="152" rx="30" fill="none" stroke="#a92a22" stroke-width="5"/>
  <!-- A lighter top edge, for depth. -->
  <path d="M40 18 H132 A22 22 0 0 1 154 40" fill="none" stroke="#f47a6f" stroke-width="4" stroke-linecap="round"/>
  <!-- The dial window. -->
  <path d="M38 50 Q86 22 134 50 L118 82 Q86 66 54 82 Z" fill="#ffd84a" stroke="#3a1d16" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#3a1d16" stroke-width="3" stroke-linecap="round">
    <path d="M57 49 L61 56"/>
    <path d="M71 42 L73 50"/>
    <path d="M86 40 L86 48"/>
    <path d="M101 42 L99 50"/>
    <path d="M115 49 L111 56"/>
  </g>
  <!-- The needle. -->
  <path d="M86 74 L102 50" stroke="#3a1d16" stroke-width="5" stroke-linecap="round"/>
  <!-- The groove between the feet. -->
  <path d="M86 128 V160" stroke="#a92a22" stroke-width="5" stroke-linecap="round"/>
</svg>
